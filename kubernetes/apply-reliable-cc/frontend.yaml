##################################################################################################
# frontend service and deployment
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  clusterIP: 10.96.88.88
  ports:
  - name: frontend
    port: 80
    targetPort: 11000
  selector:
    app: frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onlineboutique-frontend
  labels:
    account: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: onlineboutique-frontend
      containers:
      - name: frontend
        image: appnetorg/onlineboutique-arpc-variants-logging:latest
        command: ["/app/onlineboutique"]
        args: ["frontend"]
        env:
        - name: ENABLE_RELIABLE
          value: "true"
        - name: ENABLE_CC
          value: "true"
        - name: ENABLE_FC
          value: "false"
        imagePullPolicy: Always
        ports:
        - containerPort: 11000
        volumeMounts:
        - name: message-logs
          mountPath: /var/log/arpc-messages
      volumes:
      - name: message-logs
        hostPath:
          path: /users/xzhu/online-boutique-arpc/logs
          type: DirectoryOrCreate
---
# volume and persistent volume claim of `frontend`
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frontend-pv
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  storageClassName: frontend-storage
  hostPath:
    path: /data/volumes/frontend-pv   # Where all the hard drives are mounted
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontend-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: frontend-storage
  resources:
    requests:
      storage: 1Gi
---
